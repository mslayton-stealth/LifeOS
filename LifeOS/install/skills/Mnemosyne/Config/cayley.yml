# Cayley single-file BoltDB config — PAI local mode.
# __GRAPH_DIR__ is replaced with the absolute path to ~/.claude/PAI/MEMORY/GRAPH
# at install time (see INSTALL.md § 4.4).
store:
  backend: bolt
  address: "__GRAPH_DIR__/mnemosyne.bolt"
  read_only: false
  options:
    nosync: false

query:
  timeout: 30s

load:
  # Re-running the seeder is safe — duplicate quads are dropped.
  ignore_duplicates: true
  ignore_missing: false
  batch: 10000
